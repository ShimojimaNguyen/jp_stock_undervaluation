name: tenbagger-daily

# Chạy flow 10-bagger thật ở chỗ có mạng. Nguồn dùng được TỪ ACTIONS (đo 2026-10-07):
#   JPX data_j ✓ · yfinance ✓ · Yahoo chart v8 ✓ · Yahoo JP /performance ✓ (trần)
#   株探 ✗ (AWS WAF chặn IP Actions — không né) · TDnet ✗ (robots Disallow: /)
#
# NHỊP: 07:45 UTC thứ Hai–Sáu = 16:45 JST, sau khi TSE đóng cửa (15:30).
# yfinance ~1,3s/mã → toàn TSE (~3.700 mã) ≈ 80 phút; chia 5 shard theo thứ trong
# tuần. 会社予想 chỉ hỏi cho mã đã qua mọi check khác của bước 2, ≤60/ngày.
# Lần đầu: chạy tay với shard=all.
#
# DỮ LIỆU NGUỒN không lên git (bản sao vendor, repo public) → giữ giữa các lần
# chạy bằng actions/cache. CHỈ data/tenbagger-candidates.json được commit, và chỉ
# khi độ phủ cơ bản ≥ 80% universe (pipeline tự chặn).
#
# Secrets (Settings → Secrets → Actions): TYPESAFE_API_KEY (Jev — thiếu thì bỏ
# qua checklist ngữ nghĩa), EDINET_API_KEY (net cash 清原 — chưa nối).

on:
  schedule:
    - cron: "45 7 * * 1-5"
  workflow_dispatch:
    inputs:
      shard:
        description: "i/5, hoặc 'all' cho lần nạp đầu (~3,4 giờ)"
        default: "auto"
      limit:
        description: "giới hạn số mã 株探 (0 = không) — chế độ thử"
        default: "0"

permissions:
  contents: write

concurrency:
  group: tenbagger-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # secrets không dùng trực tiếp trong `if:` được → đưa ra cờ ở mức job
      HAS_JEV: ${{ secrets.TYPESAFE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Khôi phục dữ liệu nguồn
        uses: actions/cache/restore@v4
        with:
          path: |
            data/universe.json
            data/fundamentals
            data/prices
            data/forecasts
            data/jev-cache.jsonl
          key: tenbagger-data-${{ github.run_id }}
          restore-keys: tenbagger-data-

      - name: Universe JPX (thứ Hai hoặc khi chưa có)
        run: |
          if [ ! -f data/universe.json ] || [ "$(date -u +%u)" = "1" ]; then
            uv run python -m src.data.jpx_universe --out data/universe.json \
              || echo "::warning::JPX lỗi — giữ universe cũ"
          fi
          test -f data/universe.json

      - name: yfinance (1/5 universe theo thứ trong tuần)
        run: |
          shard="${{ github.event.inputs.shard || 'auto' }}"
          if [ "$shard" = "auto" ]; then shard="$(( $(date -u +%u) - 1 ))/5"; fi
          if [ "$shard" = "all" ]; then shard="0/1"; fi
          uv run python -m src.data.yf_fundamentals --universe data/universe.json \
            --shard "$shard" --limit "${{ github.event.inputs.limit || '0' }}"

      - name: Pipeline lần 1 (tìm mã chờ 会社予想)
        run: |
          uv run python -m src.pipeline --fundamentals-source yfinance \
            --universe data/universe.json --min-coverage 0 --out data/pass1.json

      - name: 会社予想 Yahoo JP (trần 60/ngày, giãn 3s — nguồn chặn sau ~85 mã)
        run: uv run python -m src.data.yahoojp_forecast --from data/pass1.json --max 60

      - name: Jev batch (mã qua bước 2)
        if: env.HAS_JEV == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: uv run python -m src.jev.run --fundamentals-source yfinance || echo "::warning::Jev lỗi một phần"

      - name: Pipeline 8 bước
        run: |
          uv run python -m src.pipeline --fundamentals-source yfinance \
            --universe data/universe.json --fetch-ohlcv

      - name: Lưu dữ liệu nguồn
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/universe.json
            data/fundamentals
            data/prices
            data/forecasts
            data/jev-cache.jsonl
          key: tenbagger-data-${{ github.run_id }}

      - name: Commit artifact nếu đổi
        run: |
          f=data/tenbagger-candidates.json
          [ -f "$f" ] || { echo "chưa có artifact (độ phủ chưa đủ) — không commit"; exit 0; }
          git add "$f"
          if git diff --cached --quiet; then echo "không đổi"; exit 0; fi
          git config user.name "tenbagger-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: tenbagger-candidates $(date -u +%F)"
          # nhánh có thể đã đi tiếp trong ~1 giờ job chạy
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
