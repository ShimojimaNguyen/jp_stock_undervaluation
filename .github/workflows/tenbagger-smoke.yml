name: tenbagger-smoke

# 2026-10-07: 株探 bị AWS WAF chặn từ IP Actions (HTTP 405 Human Verification) và
# TDnet robots.txt `Disallow: /` → cả hai KHÔNG chạy ở đây. Không né bot protection.
#
# Chạy THỬ flow 10-bagger trên một lát universe (mặc định 1/20 ≈ 190 mã, ~10 phút
# ở Crawl-delay 3s) để kiểm parser/nguồn trên dữ liệu thật trước khi chạy cả TSE.
# Chạy trên push vào nhánh claude/** (không cần merge) và chạy tay.
# Chỉ upload KẾT QUẢ ĐÃ TÍNH + chẩn đoán — không upload bản sao dữ liệu nguồn.

on:
  push:
    branches: ["claude/**"]
    paths: ["src/**", "config/**", "questions/**", ".github/workflows/tenbagger-smoke.yml"]
  workflow_dispatch:
    inputs:
      shard:
        description: "lát universe i/n"
        default: "0/5"

concurrency:
  group: tenbagger-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_JEV: ${{ secrets.TYPESAFE_API_KEY != '' }}
      OUT: smoke-out
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: mkdir -p "$OUT"

      - name: Universe JPX
        run: |
          uv run python -m src.data.jpx_universe --out data/universe.json
          uv run python -c "import json;d=json.load(open('data/universe.json'));print(d['count'],d['as_of'],d['skipped']);print(d['codes'][:3])"

      - name: Chẩn đoán robots.txt từng nguồn
        if: always()
        run: |
          UA="jp-stock-undervaluation/0.1 (research)"
          for u in https://kabutan.jp/robots.txt https://www.release.tdnet.info/robots.txt \
                   https://kabutan.jp/stock/finance?code=7203 \
                   "https://www.release.tdnet.info/inbs/I_list_001_$(date -u +%Y%m%d).html" \
                   "https://query1.finance.yahoo.com/v8/finance/chart/7203.T?range=5d&interval=1d"; do
            echo "== $u"
            curl -sS -A "$UA" -o /tmp/body -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$u" || true
            case "$u" in *robots.txt) head -c 1500 /tmp/body; echo;; esac
          done

      - name: yfinance (một lát universe)
        continue-on-error: true
        run: |
          uv run python -m src.data.yf_fundamentals --universe data/universe.json \
            --shard "${{ github.event.inputs.shard || '0/5' }}"

      - name: Chẩn đoán độ phủ từng trường
        if: always()
        run: |
          uv run python -m src.diagnostics --data-dir data --source yfinance > "$OUT/diagnostics.json"
          uv run python -c "import json;d=json.load(open('$OUT/diagnostics.json'));print('n',d['n']);print('coverage',d['coverage']);print('none',d['none_reasons'])"

      - name: Jev batch
        if: env.HAS_JEV == 'true'
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: uv run python -m src.jev.run --fundamentals-source kabutan

      - name: Pipeline lần 1 (tìm mã chờ 会社予想)
        if: always()
        run: |
          uv run python -m src.pipeline --fundamentals-source yfinance \
            --universe data/universe.json --only-fetched --min-coverage 0 \
            --out "$OUT/pass1.json"

      - name: 会社予想 Yahoo JP cho mã chờ (trần 60, giãn 3s)
        if: always()
        run: uv run python -m src.data.yahoojp_forecast --from "$OUT/pass1.json" --max 60

      - name: Pipeline lần 2 (đủ 8 bước)
        if: always()
        run: |
          uv run python -m src.pipeline --fundamentals-source yfinance \
            --universe data/universe.json --only-fetched --min-coverage 0 \
            --fetch-ohlcv --out "$OUT/tenbagger-candidates.json"
          uv run python - <<'PY'
          import json
          d = json.load(open("smoke-out/tenbagger-candidates.json"))
          print("COUNTS", d["counts"])
          print("FAILURES", d["failures"][:10])
          def line(c):
              sc = c["scorecard"]; v = sc["valuation"]; u = sc["universe"]
              chk = {x["name"]: x["value"] for x in sc["growth"]["checks"]}
              s = c.get("entry_signal") or {}
              cats = ",".join(e["type"] for e in sc["catalysts"])
              return (f"{c['tier']:4} {c['code']} {c['name']} mcap={u['market_cap']['value']} "
                      f"adtv={u['adtv']['value']} uni={u['passed']} cagr={chk['revenue_cagr']} "
                      f"opfc={chk['op_forecast_growth']} eq={chk['equity_ratio']} "
                      f"peg={v['peg']} ncr={v['net_cash_ratio']} cat=[{cats}] "
                      f"sig={s.get('signal')} thesis={(c.get('thesis') or {}).get('status')} "
                      f"why={c['tier_reasons']}")
          for c in d["candidates"]:
              print("CAND", line(c))
          for c in d["awaiting_forecast"]:
              print("WAIT", line(c))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 7
