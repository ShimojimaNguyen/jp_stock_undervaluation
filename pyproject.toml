[project]
name = "jp_stock_undervaluation"
version = "0.1.0"
description = "jp_stock_undervaluation using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.17,<2.0.0",
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "xlrd>=2.0",                # JPX data_j là .xls (OLE2) — pandas cần xlrd
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills", "src", "config", "questions"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "d6db701f-f023-4cb6-a8c8-ddbce6df65a0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["golden: gọi Jev thật — skip khi thiếu TYPESAFE_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
